<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background -->
  <rect width="256" height="256" rx="64" fill="#09090b" />
  
  <!-- Subtle Glow/Accent -->
  <circle cx="128" cy="128" r="90" fill="url(#glowGradient)" opacity="0.4" />
  
  <!-- Balance Scale Base & Post -->
  <path d="M 128 50 L 128 200" stroke="#f4f4f5" stroke-width="16" stroke-linecap="round" />
  <path d="M 80 200 L 176 200" stroke="#f4f4f5" stroke-width="20" stroke-linecap="round" />
  <path d="M 100 220 L 156 220" stroke="#a1a1aa" stroke-width="12" stroke-linecap="round" />
  <path d="M 128 50 L 128 30" stroke="#10b981" stroke-width="12" stroke-linecap="round" />
  
  <!-- Balance Beam -->
  <path d="M 50 80 L 206 80" stroke="#f4f4f5" stroke-width="16" stroke-linecap="round" />
  
  <!-- Scale Chains & Bowls -->
  <path d="M 50 80 L 30 140 L 70 140 Z" fill="none" stroke="#6366f1" stroke-width="6" stroke-linejoin="round" />
  <path d="M 206 80 L 186 140 L 226 140 Z" fill="none" stroke="#10b981" stroke-width="6" stroke-linejoin="round" />
  
  <path d="M 20 140 Q 50 160 80 140" fill="none" stroke="#f4f4f5" stroke-width="10" stroke-linecap="round" />
  <path d="M 176 140 Q 206 160 236 140" fill="none" stroke="#f4f4f5" stroke-width="10" stroke-linecap="round" />
  
  <defs>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
  </defs>
</svg>
